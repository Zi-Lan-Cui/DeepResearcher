[pytest]
; 收集范围限定在 tests;仓库根目录下可能出现的参考克隆不应进入收集。
testpaths = tests
; --import-mode=importlib 不改 sys.path，用例按文件路径独立导入，子目录可自由嵌套。
addopts = -p no:launch_testing -p no:launch_testing_ros_pytest_entrypoint -p no:langsmith_plugin --import-mode=importlib
; tests 根固定进搜索路径：子目录里的用例要能 import fakes、pg_backend 这些同层共享件。
pythonpath = tests
; 服务层异步测试用显式 @pytest.mark.asyncio（strict）。
; autoload 时 pytest-asyncio 经 entry point 自动注册；仅在
; PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 的命令（见 Makefile）需点名 -p pytest_asyncio.plugin。
asyncio_mode = strict
asyncio_default_fixture_loop_scope = function
; 已知测试竞态（仅测试形态，生产 asyncpg 无 per-connection 线程）：aiosqlite 工作线程
; 可能在 pytest-asyncio 关闭循环后仍投递一个结果回调 → 归因错位的 UnhandledThreadException
; 告警，约 1/25 概率、无断言/数据影响（回调结果本就无处可去）。
; 若该告警频率上升，重查 service fixtures 的 DB 生命周期。
filterwarnings =
    ignore::pytest.PytestUnhandledThreadExceptionWarning
