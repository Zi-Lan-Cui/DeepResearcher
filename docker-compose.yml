# API 与独立 Worker 共享 Postgres；Redis 只承载可丢弃的 token 预览。
# 本机分别运行 server.py 和 python -m deepresearcher.worker。
services:
  postgres:
    image: postgres:16
    environment:
      # 保留既有数据库资源标识；品牌重命名不应隐式迁移数据卷。
      POSTGRES_DB: ${POSTGRES_DB:-deepsearch}
      POSTGRES_USER: ${POSTGRES_USER:-deepsearch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-deepsearch}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-deepsearch} -d ${POSTGRES_DB:-deepsearch}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
