# API 与独立 Worker 共享 Postgres；本文件暂只编排基础设施。
# 本机分别运行 server.py 和 python -m deepsearch_agent.worker。
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-deepsearch}
      POSTGRES_USER: ${POSTGRES_USER:-deepsearch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-deepsearch}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-deepsearch} -d ${POSTGRES_DB:-deepsearch}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
