services:
  postgres:
    image: postgres:16
    environment:
      # 保留既有数据库资源标识；品牌重命名不应隐式迁移数据卷。
      POSTGRES_DB: ${POSTGRES_DB:-deepsearch}
      POSTGRES_USER: ${POSTGRES_USER:-deepsearch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-deepsearch}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-deepsearch} -d ${POSTGRES_DB:-deepsearch}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    command: ["python", "-m", "deepresearcher.service.main"]
    env_file: env/.env
    environment:
      # 容器内经服务名寻址,覆盖 env/.env 里的 127.0.0.1 宿主默认值。
      SERVICE_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-deepsearch}:${POSTGRES_PASSWORD:-deepsearch}@postgres:5432/${POSTGRES_DB:-deepsearch}
      SERVICE_REDIS_URL: redis://redis:6379/0
      SERVICE_MATERIAL_REDIS_URL: redis://redis:6379/0
      SERVICE_HOST: 0.0.0.0
    ports:
      - "${SERVICE_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  worker:
    build: .
    command: ["python", "-m", "deepresearcher.worker"]
    env_file: env/.env
    environment:
      SERVICE_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-deepsearch}:${POSTGRES_PASSWORD:-deepsearch}@postgres:5432/${POSTGRES_DB:-deepsearch}
      SERVICE_REDIS_URL: redis://redis:6379/0
      SERVICE_MATERIAL_REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

volumes:
  pgdata:
