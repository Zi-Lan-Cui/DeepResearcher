[project]
name = "deepsearch-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.6.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.3.0",
    "beautifulsoup4>=4.12.0",
    "pypdf>=6.0.0",
    "python-docx>=1.1.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "pytest>=8.0.0",
    "rank-bm25>=0.2.2",
    "curl-cffi==0.13.*",
    "tiktoken>=0.8.0",
]

[dependency-groups]
dev = [
    "coverage[toml]>=7.6.0",
    "pre-commit>=4.0.0",
    "pyright>=1.1.390",
    "ruff>=0.8.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["evals", "scripts"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["deepsearch_agent"]

[tool.pyright]
include = ["src"]
exclude = ["**/__pycache__",".venv","**/.*","evals", "scripts", "tests"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "basic"
reportMissingImports = "error"
reportMissingTypeStubs = "none"

[tool.coverage.run]
branch = true
source = ["src/deepsearch_agent"]
omit = ["*/__init__.py"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "@overload",
    "raise NotImplementedError",
]
fail_under = 70
show_missing = true

[tool.coverage.html]
directory = "var/coverage/html"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deepsearch_agent"]
