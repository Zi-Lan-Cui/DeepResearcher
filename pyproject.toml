[project]
name = "deepsearch-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.6.0",
    "langchain>=1.0.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.3.0",
    "beautifulsoup4>=4.12.0",
    "pypdf>=6.0.0",
    "python-docx>=1.1.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "pytest>=8.0.0",
    "rank-bm25>=0.2.2",
    "curl-cffi==0.13.*",
    "tiktoken>=0.8.0",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.31.0",
    "pyjwt>=2.13.0",
    "argon2-cffi>=25.1.0",
    "langgraph-checkpoint-postgres>=3.1.2",
    "alembic>=1.19.1",
    "redis>=6.0.0",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "coverage[toml]>=7.6.0",
    "httpx>=0.28.1",
    "pre-commit>=4.0.0",
    "pyright>=1.1.390",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.8.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["evals", "scripts"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["deepsearch_agent"]

[tool.pyright]
include = ["src"]
exclude = ["**/__pycache__",".venv","**/.*","evals", "scripts", "tests","**/node_modules"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "basic"
reportMissingImports = "error"
reportMissingTypeStubs = "none"

# tests 用结构化、故意不完整的 fake 注入生产具体类型，这是刻意的测试设计而非缺陷。
# include/exclude 只约束项目扫描；VSCode 插件对“打开的文件”永远即时分析，
# 唯一能按目录差异化的是这个 executionEnvironments：对 tests 静默形态类噪音，
# 保留 reportMissingImports / 未定义名等真错误，src 不受影响仍全量严格。
[[tool.pyright.executionEnvironments]]
root = "./tests"
reportMissingImports = "error"
reportArgumentType = "none"
reportAttributeAccessIssue = "none"
reportAssignmentType = "none"
reportOperatorIssue = "none"
reportOptionalOperand = "none"
reportGeneralTypeIssues = "none"
reportIndexIssue = "none"
reportTypedDictNotRequiredAccess = "none"

[tool.coverage.run]
branch = true
source = ["src/deepsearch_agent"]
omit = ["*/__init__.py"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "@overload",
    "raise NotImplementedError",
]
fail_under = 70
show_missing = true

[tool.coverage.html]
directory = "var/coverage/html"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deepsearch_agent"]
