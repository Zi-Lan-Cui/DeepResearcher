name: quality

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: deepsearch
          POSTGRES_USER: deepsearch
          POSTGRES_PASSWORD: deepsearch
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U deepsearch -d deepsearch"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      SERVICE_TEST_DATABASE_URL: postgresql+asyncpg://deepsearch:deepsearch@localhost:5432/deepsearch
      SERVICE_TEST_REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: latest
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked --group dev
      - run: uv run ruff check src tests scripts
      - run: uv run ruff format --check src tests scripts
      - run: uv run pyright
      # 禁用环境中的偶然插件，同时显式加载项目异步测试所需插件。
      - run: PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 uv run coverage run -m pytest -q -p pytest_asyncio.plugin
      - run: uv run coverage report
